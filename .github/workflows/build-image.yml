name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Extract pinned pi version from Dockerfile
        id: pi
        run: |
          v="$(grep -m1 '^ARG PI_VERSION=' Dockerfile | cut -d= -f2)"
          [ -n "$v" ] || { echo "PI_VERSION not found in Dockerfile" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building pi ${v}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=pi-${{ steps.pi.outputs.version }}
          labels: |
            org.opencontainers.image.title=pi
            org.opencontainers.image.description=Container image for the pi coding agent (@earendil-works/pi-coding-agent)
            org.opencontainers.image.version=${{ steps.pi.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: PI_VERSION=${{ steps.pi.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
