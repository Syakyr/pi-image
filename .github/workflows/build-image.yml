name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      pi_version:
        description: "pi version to build (blank = Dockerfile PI_VERSION pin)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: pi-smoke:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -euo pipefail
          # default path: drops to uid 1000, pi + brew on PATH
          docker run --rm pi-smoke:local --version
          docker run --rm pi-smoke:local bash -lc '
            [ "$(id -u)" = 1000 ] || { echo "expected uid 1000, got $(id -u)"; exit 1; }
            [ "$HOME" = /home/pi ] || { echo "HOME=$HOME"; exit 1; }
            brew --version | head -1
            command -v rg git gosu
          '
          # PUID/PGID remap path
          docker run --rm -e PUID=1234 -e PGID=1234 pi-smoke:local bash -lc '
            [ "$(id -u)" = 1234 ] || { echo "expected uid 1234, got $(id -u)"; exit 1; }
            touch /home/pi/.remap-ok && echo remap ok
          '
          # --user path (already non-root)
          docker run --rm --user 1000:1000 pi-smoke:local --version
          # compose file parses with the same interpolation we document
          docker compose -f compose.yml config -q && echo "compose config ok"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Extract pinned pi version from Dockerfile
        id: pi
        env:
          INPUT_VERSION: ${{ inputs.pi_version }}
        run: |
          pinned="$(grep -m1 '^ARG PI_VERSION=' Dockerfile | cut -d= -f2)"
          [ -n "$pinned" ] || { echo "PI_VERSION not found in Dockerfile" >&2; exit 1; }
          v="${INPUT_VERSION:-$pinned}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building pi ${v} (Dockerfile pin: ${pinned})"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=pi-${{ steps.pi.outputs.version }}
          labels: |
            org.opencontainers.image.title=pi
            org.opencontainers.image.description=Container image for the pi coding agent (@earendil-works/pi-coding-agent)
            org.opencontainers.image.version=${{ steps.pi.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: PI_VERSION=${{ steps.pi.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
